<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1976d2">
    <link rel="manifest" href="manifest.json">
    <title>Tarifa Moto Pro</title>
    <style>
        :root {
            --primary: #1976d2;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #333333;
            --success: #388e3c;
            --border: #ccc;
            --highlight: #e3f2fd;
        }
        body.dark-mode {
            --primary: #4fc3f7;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --success: #81c784;
            --border: #333;
            --highlight: #2c3e50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.3s; }
        
        #app-content { padding: 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 1.4rem; color: var(--primary); }
        .theme-btn { background: none; border: 2px solid var(--primary); color: var(--primary); padding: 5px 10px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        #btnInstalar { display: none; width: 100%; background-color: #f57c00; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        .daily-tracker { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .daily-tracker h2 { font-size: 1rem; font-weight: normal; margin-bottom: 5px; }
        .daily-tracker .amount { font-size: 1.8rem; font-weight: bold; }
        .reset-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 15px; border-radius: 5px; margin-top: 10px; cursor: pointer; }

        .container { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--card); color: var(--text); }
        
        .btn { width: 100%; border: none; padding: 14px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-pdf { background-color: #333; color: white; }
        
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background-color: var(--highlight); display: none; }
        .result-box.active { display: block; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
        .total-fare { font-size: 1.5rem; font-weight: bold; color: var(--success); text-align: center; margin: 15px 0; }
        
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }

        .historial-viajes { background: var(--card); padding: 15px; border-radius: 12px; font-size: 0.9rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .viaje-item { border-bottom: 1px dashed var(--border); padding: 8px 0; display: flex; flex-direction: column; }
        .viaje-detalle { display: flex; justify-content: space-between; font-weight: bold; }
        .viaje-hora { font-size: 0.8rem; color: #888; margin-top: 3px; }

        /* =========================================
           FORMATO PERFECTO PARA EL TICKET (PDF) 
           ========================================= */
        #ticket-pdf { display: none; }
        
        @media print {
            #app-content { display: none !important; }
            body { background: white !important; padding: 20px 0; margin: 0; }
            
            @page {
                size: 75mm 90mm; 
                margin: 0mm;
            }
            
            #ticket-pdf { 
                display: block !important; 
                width: 90%;
                max-width: 350px;
                margin: 0 auto; 
                padding: 15px; 
                color: black; 
                background: white; 
                font-family: 'Courier New', Courier, monospace;
                border: 2px solid #000;
                border-radius: 8px;
            }
            
            .ticket-header { text-align: center; margin-bottom: 15px; border-bottom: 2px dashed black; padding-bottom: 10px; }
            .ticket-header h2 { font-size: 1.6rem; margin: 0 0 5px 0; font-weight: bold; }
            .ticket-header p { font-size: 0.9rem; margin: 0; color: #000; }
            
            .ticket-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1.1rem; }
            .ticket-total { font-size: 1.4rem; font-weight: bold; margin-top: 15px; border-top: 2px dashed black; padding-top: 10px; }
            .ticket-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; border-top: 2px dashed black; padding-top: 10px; font-style: italic; }
        }
    </style>
</head>
<body>

<div id="app-content">
    <button id="btnInstalar" onclick="instalarApp()">📲 Instalar Aplicación en el Teléfono</button>

    <div class="header">
        <h1>🛵 Tarifa Moto Pro</h1>
        <button class="theme-btn" onclick="toggleTheme()">🌙 Noche</button>
    </div>

    <div class="daily-tracker">
        <h2>Ganancia Neta Hoy (<span id="contadorViajes">0</span> viajes)</h2>
        <div class="amount" id="totalDia">Q0.00</div>
        <button class="reset-btn" onclick="reiniciarDia()">🔄 Nuevo Turno (Borrar)</button>
    </div>

    <div class="container">
        <div class="form-row">
            <div class="form-group" style="margin-bottom: 0;">
                <label>⛽ Gasolina (Q)</label>
                <input type="number" id="gasolina" value="35" step="0.5" inputmode="decimal">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>👥 Pasajeros</label>
                <select id="pasajeros">
                    <option value="1">1 (Normal)</option>
                    <option value="2">2 (+Q5.00)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>📍 Distancia del viaje (Ida en KM)</label>
            <input type="number" id="distancia" placeholder="Ej. 5" step="0.1" inputmode="decimal">
        </div>

        <div class="form-group">
            <label>⚙️ Condición de Ruta</label>
            <select id="condicion">
                <option value="1">☀️ Día / Normal</option>
                <option value="1.2">🌧️ Noche/Lluvia (+20%)</option>
                <option value="1.3">⚠️ Terracería (+30%)</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="calcularTarifa()">Calcular Tarifa</button>

        <div class="result-box" id="resultado">
            <div class="result-item">
                <span>Gasto de tu moto:</span>
                <strong id="costoOperativo">Q0.00</strong>
            </div>
            <div class="result-item">
                <span>Tu Ganancia Limpia:</span>
                <strong id="gananciaNeta">Q0.00</strong>
            </div>
            <div class="total-fare">
                Cobrar: <span id="cobroSugerido">Q0.00</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-pdf" onclick="generarPDF()">📄 Guardar PDF</button>
                <button class="btn btn-success" onclick="guardarViaje()">✅ Guardar Viaje</button>
            </div>
        </div>
    </div>

    <div class="historial-viajes">
        <h3>📋 Historial de Hoy (Guardado)</h3>
        <div id="listaViajes" style="margin-top: 10px; color: #888;">No hay viajes registrados hoy.</div>
    </div>
</div>

<!-- TICKET PDF INVISIBLE -->
<div id="ticket-pdf">
    <div class="ticket-header">
        <h2>MOTO-TAXI</h2>
        <p id="fechaTicket"></p>
    </div>
    <div class="ticket-row"><span>Distancia:</span><strong id="pdfDistancia"></strong></div>
    <div class="ticket-row" id="filaPasajerosPdf" style="display: none;"><span>Pasajeros:</span><strong id="pdfPasajeros"></strong></div>
    <div class="ticket-row"><span>Ruta:</span><strong id="pdfCondicion"></strong></div>
    <div class="ticket-row ticket-total"><span>TOTAL:</span><strong id="pdfTotal"></strong></div>
    <div class="ticket-footer">¡Gracias por viajar seguro!</div>
</div>

<script>
    let gananciaActual = 0, tarifaActual = 0, distanciaActual = 0, condicionActual = "", pasajerosActual = 1;
    let totalAcumulado = 0, viajesAcumulados = 0;
    let historial = [];
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('btnInstalar').style.display = 'block';
    });

    function instalarApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    document.getElementById('btnInstalar').style.display = 'none';
                }
                deferredPrompt = null;
            });
        }
    }

    window.onload = function() {
        if(localStorage.getItem('moto_ganancia')) {
            totalAcumulado = parseFloat(localStorage.getItem('moto_ganancia'));
            viajesAcumulados = parseInt(localStorage.getItem('moto_viajes'));
            historial = JSON.parse(localStorage.getItem('moto_historial')) || [];
            actualizarTracker();
            renderHistorial();
        }
    }

    function calcularTarifa() {
        const dist = parseFloat(document.getElementById('distancia').value);
        const factor = parseFloat(document.getElementById('condicion').value);
        const textoCondicion = document.getElementById('condicion').options[document.getElementById('condicion').selectedIndex].text;
        
        const precioGas = parseFloat(document.getElementById('gasolina').value) || 35;
        const numPasajeros = parseInt(document.getElementById('pasajeros').value) || 1;

        if (!dist || dist <= 0) return alert("Ingresa una distancia válida.");

        const costoOperativoReal = ((dist * 2) / 140) * precioGas + ((dist * 2) * 0.10);
        
        let tarifaFinal = (3.00 + (dist * 1.50)) * factor;
        
        if (numPasajeros > 1) {
            tarifaFinal += 5.00; 
        }

        /* AQUÍ ESTÁ EL CAMBIO: Redondea al quetzal entero más cercano */
        tarifaFinal = Math.round(tarifaFinal);
        
        if(tarifaFinal < 5) tarifaFinal = 5.00;

        tarifaActual = tarifaFinal;
        gananciaActual = tarifaFinal - costoOperativoReal;
        distanciaActual = dist;
        condicionActual = textoCondicion.split(" ")[1]; 
        pasajerosActual = numPasajeros;

        document.getElementById('costoOperativo').innerText = "Q" + costoOperativoReal.toFixed(2);
        document.getElementById('gananciaNeta').innerText = "Q" + gananciaActual.toFixed(2);
        document.getElementById('cobroSugerido').innerText = "Q" + tarifaFinal.toFixed(2);
        document.getElementById('resultado').classList.add('active');
    }

    function generarPDF() {
        const ahora = new Date();
        const fechaFormat = ahora.toLocaleDateString() + " " + ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        document.getElementById('fechaTicket').innerText = fechaFormat;
        document.getElementById('pdfDistancia').innerText = distanciaActual + " km";
        document.getElementById('pdfCondicion').innerText = condicionActual;
        document.getElementById('pdfTotal').innerText = "Q" + tarifaActual.toFixed(2);
        
        const filaPasajeros = document.getElementById('filaPasajerosPdf');
        if(pasajerosActual > 1) {
            filaPasajeros.style.display = 'flex';
            document.getElementById('pdfPasajeros').innerText = pasajerosActual;
        } else {
            filaPasajeros.style.display = 'none';
        }
        
        window.print();
    }

    function guardarViaje() {
        const ahora = new Date();
        const horaStr = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        totalAcumulado += gananciaActual;
        viajesAcumulados += 1;
        
        const etiquetaPasajeros = pasajerosActual > 1 ? ' 👥' : '';
        const detalleViaje = {
            descripcion: `Viaje ${distanciaActual}km${etiquetaPasajeros} (Q${tarifaActual.toFixed(2)})`,
            ganancia: `Libre: Q${gananciaActual.toFixed(2)}`,
            hora: horaStr
        };
        
        historial.push(detalleViaje);
        
        localStorage.setItem('moto_ganancia', totalAcumulado);
        localStorage.setItem('moto_viajes', viajesAcumulados);
        localStorage.setItem('moto_historial', JSON.stringify(historial));
        
        actualizarTracker();
        renderHistorial();
        
        document.getElementById('resultado').classList.remove('active');
        document.getElementById('distancia').value = '';
    }

    function actualizarTracker() {
        document.getElementById('totalDia').innerText = "Q" + totalAcumulado.toFixed(2);
        document.getElementById('contadorViajes').innerText = viajesAcumulados;
    }

    function renderHistorial() {
        const div = document.getElementById('listaViajes');
        if(historial.length === 0) {
            div.innerHTML = "No hay viajes registrados hoy.";
            return;
        }
        
        div.innerHTML = historial.slice().reverse().map(v => `
            <div class="viaje-item">
                <div class="viaje-detalle">
                    <span>🛵 ${v.descripcion}</span>
                    <span style="color: #388e3c;">${v.ganancia}</span>
                </div>
                <div class="viaje-hora">🕒 Guardado a las ${v.hora}</div>
            </div>
        `).join('');
    }

    function reiniciarDia() {
        if(confirm("¿Seguro que quieres borrar todo el historial e iniciar en cero?")) {
            totalAcumulado = viajesAcumulados = 0; 
            historial = [];
            localStorage.clear();
            actualizarTracker(); 
            renderHistorial();
        }
    }

    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
